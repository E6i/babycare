<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Babycare mobile hero visual</title>
  <desc id="desc">Mobile crop of the Babycare waveform, baby profile, and calm risk indicator.</desc>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A7D8EF"/><stop offset="1" stop-color="#237B66"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#173140" flood-opacity=".12"/></filter>
  </defs>
  <rect width="900" height="1200" fill="none"/>
  <ellipse cx="430" cy="470" rx="410" ry="315" fill="#fffdf8" opacity=".52"/>
  <ellipse cx="350" cy="360" rx="270" ry="190" fill="#8FC4DF" opacity=".13"/>
  <g transform="translate(46 220)" filter="url(#shadow)">
    <rect x="0" y="0" width="808" height="390" rx="195" fill="#FFFDF8" opacity=".28"/>
    <g transform="translate(30 62)">
      <rect x="0" y="86" width="30" height="166" rx="15" fill="url(#wave)"/>
      <rect x="54" y="18" width="36" height="300" rx="18" fill="url(#wave)"/>
      <rect x="116" y="66" width="34" height="206" rx="17" fill="url(#wave)"/>
      <rect x="178" y="104" width="32" height="132" rx="16" fill="url(#wave)"/>
      <rect x="238" y="54" width="34" height="230" rx="17" fill="url(#wave)"/>
      <rect x="300" y="24" width="36" height="290" rx="18" fill="url(#wave)"/>
      <rect x="364" y="92" width="32" height="146" rx="16" fill="url(#wave)"/>
      <rect x="424" y="48" width="36" height="240" rx="18" fill="url(#wave)"/>
      <rect x="488" y="0" width="38" height="335" rx="19" fill="url(#wave)"/>
      <rect x="556" y="68" width="34" height="196" rx="17" fill="url(#wave)"/>
      <rect x="620" y="30" width="36" height="276" rx="18" fill="url(#wave)"/>
      <rect x="686" y="88" width="32" height="158" rx="16" fill="url(#wave)"/>
    </g>
  </g>
  <g transform="translate(70 660)" filter="url(#shadow)">
    <rect x="0" y="0" width="760" height="176" rx="88" fill="#FFFDF8" opacity=".82"/>
    <circle cx="650" cy="88" r="66" fill="#EFFBF5" stroke="#B6E5CF" stroke-width="3"/>
    <circle cx="650" cy="88" r="37" fill="#F8CDBB"/>
    <circle cx="638" cy="80" r="5" fill="#0E2A3A"/>
    <circle cx="664" cy="80" r="5" fill="#0E2A3A"/>
    <path d="M634 104C649 118 666 118 681 104" fill="none" stroke="#0E2A3A" stroke-width="6" stroke-linecap="round"/>
    <text x="560" y="70" direction="rtl" text-anchor="end" font-family="Arial, sans-serif" font-size="28" fill="#667987">ليان</text>
    <text x="560" y="124" direction="rtl" text-anchor="end" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#0E2A3A">4 شهور</text>
  </g>
  <g transform="translate(92 600)" opacity=".76" filter="url(#shadow)">
    <circle cx="92" cy="92" r="77" fill="#FFFDF8"/>
    <circle cx="92" cy="92" r="82" fill="none" stroke="#F0A08B" stroke-width="16" stroke-dasharray="170 360" stroke-linecap="round" transform="rotate(-86 92 92)"/>
    <text x="92" y="80" direction="rtl" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#237B66">مراقبة قريبة</text>
    <text x="92" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#0E2A3A">34</text>
    <text x="92" y="151" direction="rtl" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#667987">قرار أوضح</text>
